; CubeVulkan settings. Read after the Steam mods' own INI files in the game's
; Mods folder (SteamShadows, MoonLight, TerrainVariance, WaterLilies,
; WorldMotion), so values set there carry over unless repeated here.

[Game]
; Folder containing cubeworld.exe. Empty: search every Steam library.
Path=
ImportSteamModSettings=1

[Saves]
; CubeVulkan saves in the game's own format in Save\ beside the engine (docs/saves.md).
; ImportFrom=<the game's Save folder> copies its characters.db and world.db in, read only,
; while CubeVulkan has none of its own. The game's own files are never written.
ImportFrom=

[World]
; Use the owner's extracted Steam world. Generated is an experimental dev mode.
Source=Extracted
Seed=1570745101

[Terrain]
; Alpha: tall ridged mountains, mesas, deep river valleys (Alpha-like range).
; Variance: exactly the TerrainVariance mod's relief on gentle ground.
Style=Alpha
; Biome regions in blocks (Steam's are 1024).
RegionSize=2048
AlphaMountainHeight=150
Rivers=1
RiverScale=1500
RiverWidth=7
SceneryPercent=100
; Amplitude/Scale/MountainAmplitude come from Mods/TerrainVariance.ini.

[WaterLilies]
; CubeVulkan's render-only addition, on by default; never changes world generation.
; Enabled/PatchDensity/MaxPadsPerChunk/MaximumDepth may be imported from Mods/WaterLilies.ini.
; The extracted/game-world decoration uses the owner's two stock lily models (no flowers).
Enabled=1

[Render]
; Alpha (default): Cube World Alpha's lighting, sky, stars, sun and fog (docs/specs/alpha-rendering.md):
; dark nights lit by lamps and torches, warm noon sides, deep-blue distant haze.
; Steam: the Steam release's palette, lighting and sky. Applies on the next start.
Style=Alpha
; CubeVulkan's own moon for the Alpha look (Alpha itself has none; src/AlphaMoon.h). It
; rises opposite the sun, lights open ground a dark moonlit blue, casts soft shadows at
; night and shows as a pixel-art disc with its phase. Caves and interiors stay dark.
; 0 gives Alpha's pitch-black nights back. The Steam look keeps its own MoonLight moon,
; set in [Moon] (or the game's Mods/MoonLight.ini), and ignores these four keys.
Moon=1
; The moonlight's strength, in percent (0-200).
MoonBrightness=30
; How much of the moonlight a moon shadow takes away, in percent (0-100).
MoonShadowStrength=60
; The cool ambient floor under the moon, in percent (0-200).
NightAmbient=30

[Graphics]
Width=1600
Height=900
VSync=1
FieldOfView=60
ViewDistance=400
SceneryDistance=110

[Input]
; Mouse movement turns the camera; right mouse starts the special immediately.
; Menus/inventory release the cursor. 0 restores the older right-drag/tap mode.
MouseLook=1

[Shadows]
; CubeVulkan's own sun and moon shadows (neither Alpha nor Steam has shadow maps; the game's
; shade is the baked sky light, docs/specs/shadows.md). Other keys as Mods/SteamShadows.ini;
; F7 toggles shadows. 0 gives the vanilla look.
Enabled=1
; The near map's reach in blocks: 25 makes it twice as sharp as the far map.
NearRadius=25

[Motion]
; The game's own plant sway (grass, reeds, water plants) is always on. LeafSway=1 adds the
; WorldMotion mod's sway of tree leaves, which vanilla never moves (F8 toggles it).
LeafSway=0

[Time]
StartHour=10
; Game minutes per real second (1 = a 24-minute day).
MinutesPerSecond=1

[Audio]
MusicPercent=45
SoundPercent=60

[Creatures]
; Not the game's: 1 sends groups of monsters and travellers along the roads from place
; to place (the game's own AI walks them; only where they head is changed). 0 keeps the
; game's behaviour.
RoadTravel=0

[Player]
; 1 (the default): the player is the game's own creature, moved, fighting and drawn by
; the game's rules (its input, physics, abilities, hits and pose). 0: CubeVulkan's older
; player made from recordings.
Native=1

[Talk]
; Townspeople say the scripts CubeVulkan builds as the game does (docs/dialogue.md).
; 1 lets the scripts exported from the game (Extract/talk-scripts.txt) speak first.
UseExports=0

[Quests]
; CubeVulkan's own "defeat the enemies in a zone" requests. The game never gives
; these (docs/dialogue.md), so they are off; 1 turns them back on.
CubeVulkanQuests=0

[Progression]
; vanilla or pyro (PyroProgression's rules). Empty: as the owner's game (pyro when a
; PyroProgression DLL is in its Mods folder).
Mode=
; Pyro: 1 locks each region's enemy level at the player's level on first entering it (the
; discovery-locked variant), 0 lets them follow the player's level. Empty: as the owner's
; game (its Mods/PyroRelativeLevels.state). CubeVulkan reads that file and keeps its own
; entries in Saves/PyroRelativeLevels.state.
LockDiscoveredRegions=

[Events]
; Not the game's: DieuDeGlace's OverworldEvents mod (MIT). Encounters in the overworld
; (adventurers in a fight, a captive in a cage, a bounty, a locked chest and its key,
; groups holding landmarks) and villagers' quests that send you to them, marked on the
; map. 1 turns it on; its progress is kept in Saves/OverworldEvents.state.
Enabled=0
EventsPerRegion=3
ActiveEventCap=2
CooldownMinutes=120
LandmarkEventCap=2
; The sites of the travel quests (glider, boat, climbing boots, reins) become a castle,
; ancient ruins, a crypt or a tower, and those items are no longer found lying in the
; world (shops still sell them). 0: the game's own places.
ReplaceTravelLocations=1
